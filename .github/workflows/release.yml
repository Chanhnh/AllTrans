name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example: v3.0.0)"
        required: true
        default: "v3.0.0"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate release source
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'next'
        run: |
          echo "Run this workflow from the next branch."
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate release tag
        id: release
        run: |
          set -euo pipefail
          VERSION_NAME="$(awk -F'"' '/versionName/ {print $2; exit}' app/build.gradle)"
          test -n "$VERSION_NAME"
          if [ "v$VERSION_NAME" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match versionName $VERSION_NAME"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEY RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEY" | base64 --decode > app/android_sign_key.jks

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleRelease \
            -PRELEASE_STORE_FILE="$GITHUB_WORKSPACE/app/android_sign_key.jks" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Verify release APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/AllTrans-v${VERSION_NAME}-release.apk"
          test -f "$APK_PATH"

          APKSIGNER=""
          if [ -d "$ANDROID_HOME/build-tools" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          fi
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK_PATH"
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AllTrans-${{ steps.release.outputs.tag }}-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AllTrans ${{ steps.release.outputs.tag }}
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
